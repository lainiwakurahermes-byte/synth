name: build

# Manual only: this account gets no hosted macOS runner yet, so a push trigger fails every time.
on: workflow_dispatch

permissions:
  contents: write # to publish the release

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: scripts/bundle-macos.sh
      # The newest release is what the Homebrew cask downloads.
      - run: gh release create "build-${{ github.run_number }}" dist/Synth.zip --title "Build ${{ github.run_number }}" --notes "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
